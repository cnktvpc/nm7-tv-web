name = "nm7-tv-web"
main = "worker.js"
compatibility_date = "2026-10-04"

[assets]
directory = "./web-tv"
binding = "ASSETS"
run_worker_first = ["/", "/tv", "/index.html", "/app-safari-policy-mobile-controls.js", "/app-safari-policy-pc-controls.js", "/web-tv/*", "/api/*"]

[[services]]
binding = "PLAYLIST_SOURCE"
service = "phuongnm7-playlist"

[[services]]
binding = "THETHAO_SOURCE"
service = "thethaonm7"
