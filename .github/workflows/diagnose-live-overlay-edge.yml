name: Temporary NM7 historical Cloudflare asset manifest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-overlay-edge.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Generate exact manifest for the asset revision already on production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 434f03bc26fd842f4c3b3771dfe2218a03910edf
          git checkout --detach 434f03bc26fd842f4c3b3771dfe2218a03910edf
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root = Path("web-tv")
          manifest = {}
          for f in sorted(p for p in root.rglob("*") if p.is_file()):
              data = f.read_bytes()
              ext = f.suffix.lstrip(".")
              payload = base64.b64encode(data).decode("ascii") + ext
              digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()[:32]
              key = "/" + f.relative_to(root).as_posix()
              manifest[key] = {"hash": digest, "size": len(data)}
          print("NM7_ASSETS_MANIFEST_JSON_BEGIN")
          print(json.dumps(manifest, separators=(",", ":"), sort_keys=True))
          print("NM7_ASSETS_MANIFEST_JSON_END")
          print("ASSET_COUNT", len(manifest), "TOTAL_BYTES", sum(x["size"] for x in manifest.values()))
          PY
