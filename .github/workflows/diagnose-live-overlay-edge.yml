name: Verify NM7 production recovery and LIVE overlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-overlay-edge.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check restored production homepage and LIVE overlay paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web.phuongnm7-iptv.workers.dev"
          for path in "/" "/?diag=restore" "/app-safari-policy-mobile-controls.js?v=20261018-live-hide-overlay4" "/app-safari-policy-pc-controls.js?v=20261018-live-hide-overlay4" "/assets/nm7-default-background.webp"; do
            out="$(mktemp)"
            status="$(curl -sS --max-time 30 -o "$out" -w "%{http_code}" "$BASE$path")"
            size="$(wc -c < "$out")"
            echo "PATH=$path STATUS=$status SIZE=$size"
            if [ "$path" = "/" ] || [ "$path" = "/?diag=restore" ]; then
              grep -Fq "NM7 TV 1.0.69" "$out" && echo "HOME_MARKER=NM7_TV_1.0.69_PRESENT" || true
              grep -Fq '#player.live-playback #playerTop{display:none!important;}' "$out" && echo "OVERLAY_CSS=present" || true
            fi
            if [[ "$path" == *mobile-controls* || "$path" == *pc-controls* ]]; then
              grep -q '__nm7LiveTitleHideV4' "$out" && echo "JS_HIDE_MARKER=present" || true
            fi
            rm -f "$out"
          done
