name: Temporary NM7 asset manifest generator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-overlay-edge.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Generate Cloudflare static-assets manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("web-tv")
          manifest = {}
          for f in sorted(p for p in root.rglob("*") if p.is_file()):
              data = f.read_bytes()
              key = "/" + f.relative_to(root).as_posix()
              manifest[key] = {"hash": hashlib.sha256(data).hexdigest()[:32], "size": len(data)}
          print("NM7_ASSETS_MANIFEST_JSON_BEGIN")
          print(json.dumps(manifest, separators=(",", ":")))
          print("NM7_ASSETS_MANIFEST_JSON_END")
          print("ASSET_COUNT", len(manifest), "TOTAL_BYTES", sum(x["size"] for x in manifest.values()))
          PY
