name: Validate NM7 EPG Guide

on:
  push:
    branches:
      - feature/epg-tv-guide-20261022
  pull_request:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'web-tv/**'
      - 'scripts/test-epg-*.js'
      - 'scripts/test-ipad-landscape-menu.js'
      - 'scripts/test-live-player-hide-metadata.js'
      - 'scripts/test-menu-fullscreen.js'
      - '.github/workflows/epg-guide-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check worker.js
          node --check web-tv/app.js
          node --check web-tv/app-safari-policy.js
          node --check web-tv/app-safari-policy-pc-controls.js
          node --check web-tv/app-safari-policy-mobile-controls.js
          node --check web-tv/epg-core.js
          node --check web-tv/tv-guide.js
      - name: Run EPG unit and integration regression tests
        run: |
          set -euo pipefail
          node scripts/test-epg-core.js
          node scripts/test-epg-guide.js
      - name: Run surrounding NM7 regressions
        run: |
          set -euo pipefail
          node scripts/test-live-feed.js
          node scripts/test-sport-playlist-refresh.js
          node scripts/test-ipad-landscape-menu.js
          node scripts/test-getout-news-entry.js
          node scripts/test-onplus-media-url.js
          node scripts/test-news-thumbnail-parser.js
          node scripts/test-home-title-mobile-overlap.js
          node scripts/test-desktop-home-tabs.js
          node scripts/test-live-player-hide-metadata.js
          node scripts/test-playback-startup-fallback.js
          node scripts/test-tv360-playback-routing.js
          node scripts/test-menu-fullscreen.js
      - name: Verify guide assets
        run: |
          test -f web-tv/tv-guide.html
          test -f web-tv/tv-guide.js
          test -f web-tv/epg-core.js
          echo "NM7_EPG_GUIDE_CI_PASS"
