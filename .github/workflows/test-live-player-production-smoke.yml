# Production validation after the tested LIVE-only metadata fix is deployed.
name: NM7 TV Web Production LIVE title overlay smoke

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "web-tv/index.html"
      - "web-tv/app.js"
      - "web-tv/app-safari-policy-mobile-controls.js"
      - "web-tv/app-safari-policy-pc-controls.js"
      - ".github/workflows/test-live-player-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch production HTML and active player runtimes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web.phuongnm7-iptv.workers.dev"
          CACHE="20261022-logo-scroll-load1&retryToast=20261019-cleanup1"
          curl -fsSL --max-time 30 "$BASE/?__nm7_live_title_smoke=$GITHUB_SHA" -o /tmp/nm7-production.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/nm7-production.html').read_text(encoding='utf-8')
          required = [
              '#player.live-playback #playerTop{display:none!important;}',
              '#player.live-playback #playerTitle{display:none!important;}',
              '#player:not(.live-playback) #playerTop{display:none!important;}',
              'retryToast=20261019-cleanup1',
              'app-safari-policy-mobile-controls.js?v=20261022-logo-scroll-load1&retryToast=20261019-cleanup1'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('PRODUCTION_HTML_MISSING_LIVE_OVERLAY_MARKERS: ' + repr(missing))
          print('NM7_PRODUCTION_LIVE_OVERLAY_HTML_OK')
          PY

          for variant in mobile pc; do
            url="$BASE/app-safari-policy-$variant-controls.js?v=$CACHE&smoke=$GITHUB_SHA"
            curl -fsSL --max-time 30 "$url" -o "/tmp/nm7-$variant-player.js"
            python3 - "$variant" "/tmp/nm7-$variant-player.js" <<'PY'
          from pathlib import Path
          import sys
          variant, path = sys.argv[1], sys.argv[2]
          js = Path(path).read_text(encoding='utf-8')
          marker = "S.zone='player';$('player').className=S.livePlaybackContext?'live-playback':'';"
          if marker not in js:
              raise SystemExit('PRODUCTION_' + variant.upper() + '_RUNTIME_MISSING_TESTED_LIVE_STATE')
          print('NM7_PRODUCTION_' + variant.upper() + '_TESTED_LIVE_STATE_OK')
          PY
          done
          echo "NM7_PRODUCTION_LIVE_TITLE_OVERLAY_SMOKE_OK"
