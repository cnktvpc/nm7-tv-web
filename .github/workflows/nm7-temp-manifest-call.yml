name: Temporary NM7 asset manifest probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nm7-temp-manifest-call.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed assets over Cloudflare service binding
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            "https://nm7-static-assets-uploader.phuongnm7-iptv.workers.dev/manifest/mvd7e9dou6azk2w5o4sbt4t5ttoyn"
