name: Preview GetOut Ban tin on Cloudflare

on:
  push:
    branches:
      - feature/getout-ban-tin-20261010

permissions:
  contents: read

concurrency:
  group: nm7-news-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < worker.js
          node --check web-tv/app.js
          node --check web-tv/app-safari-policy.js
          node scripts/test-sport-playlist-refresh.js
          node scripts/test-ipad-landscape-menu.js
          node scripts/test-getout-news-entry.js
          node scripts/test-onplus-media-url.js
          node scripts/test-news-thumbnail-parser.js
          test -f web-tv/ban-tin.html
          grep -q "/api/news" worker.js
          grep -q "Bản tin" web-tv/index.html
          echo "NEWS_PREVIEW_STATIC_CHECKS_OK"

      - name: Deploy isolated preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.toml

      - name: Smoke test preview homepage and news API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web-news-preview.phuongnm7-iptv.workers.dev"
          curl -fsSL --retry 5 --retry-delay 3 --max-time 45 "$BASE/" -o /tmp/news-preview-home.html
          curl -fsSL --retry 5 --retry-delay 3 --max-time 45 "$BASE/ban-tin.html" -o /tmp/news-preview-page.html
          grep -q "NM7 TV 1.0.69" /tmp/news-preview-home.html
          grep -q "Bản tin" /tmp/news-preview-home.html
          grep -q "Highlights" /tmp/news-preview-page.html
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$BASE/app-safari-policy.js?v=20261010-ipad-landscape-menu1&news=20261010" -o /tmp/news-preview-app.js
          grep -q "btnNewsTab.*addEventListener" /tmp/news-preview-app.js
          grep -q "Bản tin · Highlights / Xem lại" /tmp/news-preview-app.js
          grep -q "location.href=.*/ban-tin.html" /tmp/news-preview-app.js
          grep -q "btnNewsTab" /tmp/news-preview-home.html
          curl -fsSL --retry 2 --retry-delay 2 --max-time 30 "$BASE/api/news?source=highlights" -o /tmp/news-preview-api.json
          python3 - <<'PY'
          import json
          p='/tmp/news-preview-api.json'
          with open(p,encoding='utf-8') as f:
              data=json.load(f)
          if data.get('source') != 'highlights':
              raise SystemExit('Unexpected source in preview API response: '+repr(data.get('source')))
          if 'items' not in data or not isinstance(data['items'], list):
              raise SystemExit('Preview API response does not contain an items array')
          if data.get('error'):
              raise SystemExit('News upstream failed: '+str(data['error']))
          print('NEWS_PREVIEW_API_OK items=',len(data['items']),'source=',data.get('sourceUrl'))
          PY
          for src in onplus replay; do
            status=$(curl -sS --retry 1 --retry-delay 2 --max-time 25 -o "/tmp/news-preview-$src.json" -w "%{http_code} %{time_total}" "$BASE/api/news?source=$src&refresh=1" || true)
            python3 - "$src" "$status" "/tmp/news-preview-$src.json" "$BASE" <<'PY'
          import json,sys,datetime
          source,status,path,base=sys.argv[1],sys.argv[2],sys.argv[3],sys.argv[4]
          parts=status.split()
          http=parts[0] if parts else '000'
          elapsed=parts[1] if len(parts)>1 else 'unknown'
          try:
              with open(path,encoding='utf-8') as f:
                  data=json.load(f)
          except Exception as e:
              if http != '200':
                  print('NEWS_PREVIEW_PROVIDER_WARN source=',source,'http=',http,'elapsed_s=',elapsed,'body is not JSON:',e)
                  raise SystemExit(0)
              raise SystemExit('Provider returned HTTP 200 but invalid JSON for '+source+': '+str(e))
          if data.get('source') != source:
              raise SystemExit('Wrong source in '+source+' response: '+repr(data.get('source')))
          if 'items' not in data or not isinstance(data['items'],list):
              raise SystemExit('No items array in '+source+' response')
          playable=sum(1 for item in data['items'] if item.get('playbackUrl'))
          images=sum(1 for item in data['items'] if item.get('image','').startswith('https://') or item.get('image','').startswith('/api/image?'))
          if http == '200' and data.get('error'):
              raise SystemExit('Provider error with HTTP 200 for '+source+': '+str(data['error']))
          if http == '200' and data.get('updatedAt'):
              updated=datetime.datetime.fromisoformat(data['updatedAt'].replace('Z','+00:00'))
              age=(datetime.datetime.now(datetime.timezone.utc)-updated).total_seconds()
              if age > 120:
                  raise SystemExit('Forced refresh did not produce recent updatedAt for '+source+': age_s='+str(round(age)))
          if source in ('onplus','replay') and http == '200' and data['items'] and images == 0:
              raise SystemExit('NEWS_THUMBNAIL_REGRESSION source='+source+' all '+str(len(data['items']))+' items lack image URLs')
          if source in ('onplus','replay') and http == '200':
              import subprocess,os
              from urllib.parse import urlsplit
              checked=set()
              verified_images=0
              for idx,item in enumerate(data['items']):
                  image=item.get('image','')
                  if not image or image in checked: continue
                  checked.add(image)
                  target=base+image if image.startswith('/api/image?') else image
                  original=urlsplit(image)
                  if image.startswith('/api/image?'):
                      from urllib.parse import parse_qs,urlparse
                      original_url=parse_qs(urlparse(image).query).get('u',[''])[0]
                  else:
                      original_url=image
                  original_host=urlsplit(original_url).netloc
                  tmp='/tmp/nm7-'+source+'-image-'+str(len(checked))
                  try:
                      proc=subprocess.run(['curl','-L','-sS','--max-time','10','--range','0-4095','--output',tmp,'--write-out','%{http_code}|%{content_type}|%{size_download}|%{url_effective}',target],capture_output=True,text=True)
                      meta=proc.stdout.strip().split('|')
                      code=meta[0] if len(meta)>0 else '000'
                      mime=meta[1] if len(meta)>1 else ''
                      size=meta[2] if len(meta)>2 else '0'
                      effective=meta[3] if len(meta)>3 else target
                      host=urlsplit(effective).netloc
                      data_prefix=open(tmp,'rb').read(16) if os.path.exists(tmp) else b''
                      data_hex=data_prefix.hex()
                      image_magic=data_hex.startswith(('ffd8ff','89504e470d0a1a0a','474946383761','474946383961','52494646')) or (len(data_prefix)>=12 and data_prefix[4:8]==b'WEBP')
                      print('NEWS_IMAGE_HTTP_PROBE source='+source+' code='+code+' mime='+mime+' bytes='+size+' magic='+str(image_magic).lower()+' host='+host+' original='+original_host+' path='+urlsplit(effective).path[:100])
                      if code in ('200','206') and mime.lower().startswith('image/') and image_magic and int(size or '0')>0:
                          verified_images+=1
                  except Exception as e:
                      print('NEWS_IMAGE_HTTP_PROBE source='+source+' error='+str(e)[:100]+' host='+urlsplit(image).netloc+' path='+urlsplit(image).path[:100])
                  finally:
                      try: os.unlink(tmp)
                      except OSError: pass
                  if len(checked)>=6: break
              print('NEWS_IMAGE_FETCH_SUMMARY source='+source+' verified='+str(verified_images)+' tested='+str(len(checked)))
              if checked and verified_images < min(3,len(checked)):
                  raise SystemExit('NEWS_IMAGE_FETCH_REGRESSION source='+source+' verified='+str(verified_images)+' tested='+str(len(checked)))
          if source == 'replay' and http == '200' and (not data['items'] or playable == 0):
              raise SystemExit('GetOut replay regression: items='+str(len(data['items']))+' directMedia='+str(playable))
          if source == 'replay' and http == '200':
              titles=[str(item.get('title','')).strip() for item in data['items']]
              bad_titles=[title for title in titles if title.lower().rstrip().endswith((' vs',' vs.'))]
              named=sum(1 for item in data['items'] if item.get('homeName') and item.get('awayName'))
              print('NEWS_REPLAY_TITLE_CHECK named_matches='+str(named)+' total='+str(len(data['items']))+' incomplete_vs='+str(len(bad_titles)))
              if bad_titles:
                  raise SystemExit('NEWS_REPLAY_TITLE_REGRESSION: titles end in vs without an away team: '+repr(bad_titles[:3]))
              if data['items'] and named == 0:
                  raise SystemExit('NEWS_REPLAY_TITLE_REGRESSION: no replay item exposes both team names')
          if http != '200' or data.get('error'):
              print('NEWS_PREVIEW_PROVIDER_WARN source=',source,'http=',http,'elapsed_s=',elapsed,'items=',len(data['items']),'images=',images,'error=',data.get('error'))
          else:
              print('NEWS_PREVIEW_PROVIDER_OK source=',source,'http=',http,'elapsed_s=',elapsed,'items=',len(data['items']),'images=',images,'directMedia=',playable,'label=',data.get('label'))
          PY
            cached=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code} %{time_total}" "$BASE/api/news?source=$src" || true)
            python3 - "$src" "$cached" <<'PY'
          import sys
          source,result=sys.argv[1],sys.argv[2]
          parts=result.split()
          code=parts[0] if parts else '000'
          elapsed=float(parts[1]) if len(parts)>1 else 999
          if code != '200':
              raise SystemExit('NEWS_PREVIEW_CACHE_READ_FAIL source='+source+' http='+code)
          print('NEWS_PREVIEW_CACHE_HIT source='+source+' elapsed_s='+str(round(elapsed,3))+' fast='+(str(elapsed<2).lower()))
          PY
          done
          python3 - "$BASE" <<'PY'
          import json,subprocess,sys
          from urllib.parse import urljoin
          base=sys.argv[1]
          def curl(args, timeout=20):
              return subprocess.run(['curl','-sS','--max-time',str(timeout)]+args,capture_output=True)
          def get_json(url, params=None, timeout=20):
              args=[]
              if params:
                  args += ['--get']
                  for key,value in params.items():
                      args += ['--data-urlencode', key+'='+value]
              args += [url]
              proc=curl(args,timeout)
              if proc.returncode:
                  return None
              try:
                  return json.loads(proc.stdout)
              except Exception:
                  return None
          def probe_media(playable):
              title,kind,media_url=playable[:3]
              if kind=='hls':
                  manifest=curl(['--fail','--location',media_url],12)
                  if manifest.returncode or b'#EXTM3U' not in manifest.stdout[:8192]:
                      print('NEWS_MEDIA_PROBE_FAIL type=hls step=manifest curlCode=',manifest.returncode,'bytes=',len(manifest.stdout),'title=',title[:80])
                      return False
                  lines=[line.strip() for line in manifest.stdout.decode('utf-8','replace').splitlines() if line.strip() and not line.lstrip().startswith('#')]
                  if lines:
                      child=urljoin(base+'/',lines[0])
                      segment=curl(['--fail','--location','--range','0-2047',child],12)
                      if segment.returncode or len(segment.stdout)<16:
                          print('NEWS_MEDIA_PROBE_FAIL type=hls step=child curlCode=',segment.returncode,'bytes=',len(segment.stdout),'title=',title[:80])
                          return False
                  print('NEWS_MEDIA_PROBE_OK type=hls manifestBytes=',len(manifest.stdout),'childChecked=',bool(lines),'title=',title[:80])
                  return True
              if kind=='mp4':
                  import tempfile,os
                  fd,path=tempfile.mkstemp(prefix='nm7-onplus-mp4-')
                  os.close(fd)
                  proc=curl(['--location','--range','0-4095','--output',path,'--write-out','%{http_code}\t%{content_type}\t%{size_download}',media_url],15)
                  try:
                      data=open(path,'rb').read(8192)
                  finally:
                      os.unlink(path)
                  meta=proc.stdout.decode('utf-8','replace').strip().split('\t')
                  code=meta[0] if len(meta)>0 else '000'
                  content_type=meta[1] if len(meta)>1 else ''
                  size=meta[2] if len(meta)>2 else str(len(data))
                  ok=proc.returncode==0 and code in ('200','206') and len(data)>=8 and b'ftyp' in data[:128]
                  body_hint=data.decode('utf-8','replace').strip()[:180].replace('\\n',' ').replace('\\r',' ')
                  if '://' in body_hint:
                      import re
                      body_hint=re.sub(r'https?://[^\\s\\"<>]+','[url]',body_hint)
                  print('NEWS_MEDIA_PROBE_'+('OK' if ok else 'FAIL'),'type=mp4','http=',code,'contentType=',content_type,'bytes=',size,'ftyp=',b'ftyp' in data[:128],'bodyHint=',body_hint,'title=',title[:80])
                  return ok
              print('NEWS_MEDIA_PROBE_FAIL unsupported media type=',kind)
              return False
          failures=[]
          for source in ('highlights','onplus'):
              listing=get_json(base+'/api/news',{'source':source},30)
              if not listing or not isinstance(listing.get('items'),list):
                  failures.append('missing list for '+source)
                  continue
              playable=None
              errors=[]
              for item in listing['items'][:15]:
                  href=item.get('href')
                  if not href:
                      continue
                  if source=='onplus' and (item.get('isPremium') or item.get('isProtected')):
                      continue
                  params={'source':source,'url':href}
                  result=get_json(base+'/api/news/play',params,18)
                  if result and result.get('ok') and result.get('playbackType') in ('hls','mp4') and result.get('playbackUrl','').startswith(base+'/api/stream?'):
                      playable=(item.get('title',''),result.get('playbackType'),result.get('playbackUrl'))
                      break
                  if result:
                      errors.append(result.get('message','no public stream'))
              if not playable:
                  failures.append('resolver failed for '+source+' tried='+str(min(15,len(listing['items'])))+' errors='+json.dumps(errors[-3:],ensure_ascii=False))
                  continue
              print('NEWS_PLAYBACK_RESOLVED source=',source,'type=',playable[1],'title=',playable[0][:100])
              if not probe_media(playable): failures.append('stream probe failed for '+source)
          replay=get_json(base+'/api/news',{'source':'replay'},25)
          if not replay or not replay.get('items'):
              failures.append('GetOut replay list empty')
          else:
              replayItem=next((item for item in replay['items'] if item.get('playbackUrl') and item.get('playbackType')=='hls'),None)
              if not replayItem:
                  failures.append('no direct HLS URL in GetOut replay list')
              elif not probe_media((replayItem.get('title','GetOut replay'),'hls',replayItem['playbackUrl'])):
                  failures.append('stream probe failed for GetOut replay')
          if failures:
              raise SystemExit('NEWS_PREVIEW_END_TO_END_FAIL: '+ '; '.join(failures))
          PY
          echo "NEWS_PREVIEW_SMOKE_TEST_OK URL=$BASE/ban-tin.html"
