      - name: Smoke test production Bản tin GetOut
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web.phuongnm7-iptv.workers.dev"
          curl -fsSL --max-redirs 3 --max-time 30 "$BASE/ban-tin.html" -o /tmp/nm7-production-news.html
          grep -q "Bản tin" /tmp/nm7-production-news.html
          grep -q "Tin thể thao" /tmp/nm7-production-news.html
          for src in highlights onplus replay; do
            code=$(curl -sS --retry 2 --retry-delay 2 --max-time 35 -o "/tmp/nm7-production-news-$src.json" -w "%{http_code}" "$BASE/api/news?source=$src&refresh=1" || true)
            python3 - "$src" "$code" "/tmp/nm7-production-news-$src.json" <<'PY'
          import json,sys,time,datetime
          source,code,path=sys.argv[1],sys.argv[2],sys.argv[3]
          if code!='200':
              raise SystemExit('PRODUCTION_NEWS_HTTP_FAIL source='+source+' code='+code)
          with open(path,encoding='utf-8') as f: data=json.load(f)
          items=data.get('items')
          if data.get('source')!=source or not isinstance(items,list) or not items:
              raise SystemExit('PRODUCTION_NEWS_EMPTY_OR_WRONG_SOURCE source='+source)
          if data.get('error'):
              raise SystemExit('PRODUCTION_NEWS_UPSTREAM_ERROR source='+source+' '+str(data['error']))
          updated=data.get('updatedAt')
          if updated:
              age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(updated.replace('Z','+00:00'))).total_seconds()
              if age>120: raise SystemExit('PRODUCTION_NEWS_STALE source='+source+' age_s='+str(round(age)))
          images=sum(1 for item in items if item.get('image'))
          if source in ('onplus','replay') and images==0:
              raise SystemExit('PRODUCTION_NEWS_NO_THUMBNAILS source='+source)
          if source=='replay':
              named=sum(1 for item in items if item.get('homeName') and item.get('awayName'))
              bad=[item.get('title','') for item in items if str(item.get('title','')).lower().rstrip().endswith((' vs',' vs.'))]
              if named<len(items):
                  raise SystemExit('PRODUCTION_REPLAY_TEAM_NAMES_INCOMPLETE named='+str(named)+' total='+str(len(items)))
              if bad:
                  raise SystemExit('PRODUCTION_REPLAY_INCOMPLETE_TITLE '+repr(bad[:3]))
          print('PRODUCTION_NEWS_API_OK source='+source+' items='+str(len(items))+' images='+str(images)+' label='+str(data.get('label')))
          PY
          done
          python3 - "$BASE" <<'PY'
          import json,os,subprocess,sys,tempfile
          from urllib.parse import urljoin
          base=sys.argv[1]
          def img_ok(src):
              data=json.load(open('/tmp/nm7-production-news-'+src+'.json',encoding='utf-8'))
              candidates=[]
              seen=set()
              for item in data.get('items',[]):
                  u=item.get('image','')
                  if not u: continue
                  target=urljoin(base+'/',u)
                  if target not in seen:
                      seen.add(target); candidates.append((target,u))
                  if len(candidates)>=3: break
              verified=0
              for i,(target,original) in enumerate(candidates):
                  fd,path=tempfile.mkstemp(prefix='nm7-prod-news-img-')
                  os.close(fd)
                  try:
                      proc=subprocess.run(['curl','-L','-sS','--max-time','12','--range','0-4095','--output',path,'--write-out','%{http_code}|%{content_type}|%{size_download}',target],capture_output=True,text=True)
                      parts=proc.stdout.strip().split('|')
                      code=parts[0] if len(parts)>0 else '000'
                      mime=parts[1] if len(parts)>1 else ''
                      size=int(parts[2]) if len(parts)>2 and parts[2].isdigit() else 0
                      prefix=open(path,'rb').read(32) if os.path.exists(path) else b''
                      magic=prefix.startswith((b'\xff\xd8\xff',b'\x89PNG\r\n\x1a\n',b'GIF87a',b'GIF89a',b'RIFF')) or (len(prefix)>=12 and prefix[4:8] in (b'ftyp',b'WEBP')) or b'<svg' in prefix.lower()
                      ok=code in ('200','206') and mime.lower().startswith('image/') and size>0 and magic
                      print('PRODUCTION_NEWS_IMAGE_'+('OK' if ok else 'FAIL')+' source='+src+' http='+code+' mime='+mime+' bytes='+str(size)+' magic='+str(bool(magic)).lower())
                      if ok: verified+=1
                  finally:
                      try: os.unlink(path)
                      except OSError: pass
              if len(candidates)<2 or verified<2:
                  raise SystemExit('PRODUCTION_NEWS_IMAGE_FETCH_FAIL source='+src+' verified='+str(verified)+' tested='+str(len(candidates)))
              print('PRODUCTION_NEWS_IMAGE_FETCH_OK source='+src+' verified='+str(verified)+' tested='+str(len(candidates)))
          for src in ('onplus','replay'): img_ok(src)
          PY

      - name: Publish Cloudflare production source smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state="success"
          if [ "$JOB_STATUS" != "success" ]; then state="failure"; fi
          summary="$(cat /tmp/nm7-target-source-summary.txt 2>/dev/null || true)"
          if [ -z "$summary" ]; then summary="Cloudflare production deploy/smoke $state; inspect workflow logs"; fi
          summary="${summary:0:140}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="NM7 Cloudflare production source smoke" \
            -f description="$summary" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "CLOUDFLARE_PRODUCTION_STATUS_PUBLISHED $state $summary"
