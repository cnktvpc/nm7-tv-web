name: Temporary NM7 asset manifest generator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nm7-compute-assets-manifest.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Generate asset manifest hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("web-tv")
          manifest = {}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              rel = "/" + p.relative_to(root).as_posix()
              manifest[rel] = {"hash": hashlib.sha256(raw).hexdigest()[:32], "size": len(raw)}
          print("NM7_ASSET_MANIFEST_BEGIN")
          print(json.dumps(manifest, separators=(",", ":"), sort_keys=True))
          print("NM7_ASSET_MANIFEST_END")
          print("NM7_ASSET_MANIFEST_FILES=" + str(len(manifest)))
          print("NM7_ASSET_MANIFEST_BYTES=" + str(sum(v["size"] for v in manifest.values())))
          PY
