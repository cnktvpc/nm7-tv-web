name: Temporary NM7 static asset manifest probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nm7-static-asset-manifest-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch manifest from temporary Cloudflare helper
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 300 \
            "https://nm7-static-assets-uploader.phuongnm7-iptv.workers.dev/manifest" \
            -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/manifest.json').read_text())
          print(json.dumps(data,separators=(',',':')))
          PY
