name: Deploy LIVE metadata fix to isolated preview

on:
  push:
    branches:
      - fix/live-player-hide-title-source-20261018
    paths:
      - "worker.js"
      - "wrangler.live-preview.toml"
      - "web-tv/**"
      - "scripts/test-live-player-hide-metadata.js"
      - ".github/workflows/deploy-live-overlay-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nm7-live-overlay-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and LIVE-only regression
        run: |
          set -euo pipefail
          node --check web-tv/app.js
          node --check web-tv/app-safari-policy-mobile-controls.js
          node --input-type=module --check < worker.js
          node scripts/test-live-player-hide-metadata.js

      - name: Deploy only to isolated LIVE preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.live-preview.toml

      - name: Smoke-test the preview URL and active runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nm7-tv-web-live-preview.phuongnm7-iptv.workers.dev"
          curl -fsSL --max-time 30 "${BASE}/?live-overlay-smoke=$(date +%s)" -o /tmp/nm7-preview.html
          grep -Fq '#player.live-playback #playerTop{display:none!important;}' /tmp/nm7-preview.html
          grep -Fq 'app-safari-policy-mobile-controls.js?v=20261018-live-hide-overlay1' /tmp/nm7-preview.html
          curl -fsSL --max-time 30 "${BASE}/app-safari-policy-mobile-controls.js?v=20261018-live-hide-overlay1" -o /tmp/nm7-preview-app.js
          grep -Fq "S.livePlaybackContext?'live-playback':''" /tmp/nm7-preview-app.js
          echo "NM7_TV_WEB_LIVE_OVERLAY_PREVIEW_SMOKE_OK"
